<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数见 · 经营数据工作台</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="ux.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="import.css">
<script src="vendor/echarts.min.js" defer></script>
<script src="feedback.js" defer></script>
<script src="app.js" defer></script>
<script src="import.js" defer></script>
<script src="chart-logic.js" defer></script>
<script src="chart-state.js" defer></script>
<script src="chart-inputs.js" defer></script>
<script src="studio.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main" onclick="event.preventDefault();document.getElementById('main').focus();">跳到主要内容</a>
<header class="workspace-header"><a class="brand" href="#home"><img class="brandmark" src="favicon.svg" width="34" height="34" alt=""><span>数见<small>DATA WORKSPACE</small></span></a><nav id="nav" aria-label="主导航"><button data-page="home"><span>工作台</span></button><button data-page="explore"><span>数据管理</span><em id="tableCount"></em></button><button data-page="compare"><span>图表展示</span><em id="basketCount">0</em></button><button data-page="saved"><span>收藏的分析</span></button></nav><div class="workspace-tools"><span class="workspace-label">本地工作空间</span><span class="storage-note"><span class="dot"></span> 数据保存在本机</span><button id="sourceButton">管理数据源 ↗</button></div></header>
<div class="app"><header class="topbar"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索全部文件、参数或数据内容…" aria-label="全局搜索"><kbd>/</kbd></div><div class="top-actions"><span id="syncStatus" role="status">正在连接数据仓库</span><button id="importButton" class="primary" aria-haspopup="dialog" aria-controls="importDialog">导入<span class="action-detail">文件</span></button><button id="syncButton" aria-label="同步数据">↻ 同步<span class="action-detail">数据</span></button></div></header><main id="main" tabindex="-1"></main></div>
<dialog id="dialog"><div id="dialogBody"></div><form method="dialog"><button class="dialog-close" aria-label="关闭对话框">×</button></form></dialog><div id="toast" role="status" aria-live="polite"></div>
<dialog id="importDialog" aria-labelledby="importTitle">
  <h2 id="importTitle">导入 Excel 文件</h2>
  <p class="meta">支持多选 .xlsx、.xlsm，单个文件不超过 256 MB。同名文件会先请你确认，确认后覆盖原文件；取消则跳过该文件。</p>
  <p class="import-destination">保存到当前数据源：<span id="importFolder">正在读取…</span></p>
  <label class="import-picker" for="importFiles">选择文件<input id="importFiles" type="file" accept=".xlsx,.xlsm" multiple aria-describedby="importStatus"></label>
  <ul id="importList" class="import-list" aria-label="文件导入结果"></ul>
  <progress id="importProgress" max="1" value="0" aria-label="文件上传进度" hidden></progress>
  <p id="importStatus" class="meta" role="status" aria-live="polite">选择文件后开始导入。</p>
  <div class="import-actions"><button id="importStart" class="primary" disabled>开始导入</button><form method="dialog"><button id="importDone">关闭</button></form></div>
</dialog>
<dialog id="importOverwriteDialog" aria-labelledby="importOverwriteTitle" aria-describedby="importOverwriteNote">
  <h2 id="importOverwriteTitle">确认覆盖同名文件？</h2>
  <p id="importOverwriteName" class="import-conflict-name"></p>
  <p id="importOverwriteFolder" class="import-destination"></p>
  <p id="importOverwriteSizes" class="meta"></p>
  <p id="importOverwriteNote">新文件将替换上述目录中的原文件，原内容无法在工作台内撤销。取消会跳过此文件，继续导入其他文件。</p>
  <p id="importOverwriteChanged" class="meta" hidden>文件在上次确认后已发生变化，请核对后再次确认。</p>
  <form method="dialog" class="import-actions"><button value="skip" autofocus>取消，保留原文件</button><button value="replace" class="import-replace">确认覆盖</button></form>
</dialog>
</body></html>
